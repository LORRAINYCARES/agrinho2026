<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSim Agro 2026</title>
</head>
<body>
    <header>
        <h1>EcoSim Agro 2026</h1>
        <p>Equilíbrio entre produção e meio ambiente</p>
    </header>

    <hr> <main id="game-container">
        <section class="stats">
            <h2>Status do Jogo</h2>
            <ul>
                <li><strong>Dinheiro:</strong> R$ <span id="dinheiro">500</span></li>
                <li><strong>Turno:</strong> <span id="turno">1</span>/10</li>
            </ul>
        </section>

        <section class="status-solo">
            <p><strong>Saúde do Solo:</strong> <span id="solo-texto">100</span>%</p>
            <progress id="barra-progresso" value="100" max="100"></progress>
        </section>

        <br>

        <section id="display-area">
            <fieldset>
                <legend>Painel do Produtor</legend>
                <p id="mensagem">Bem-vindo, produtor! Escolha como usar sua terra nesta rodada.</p>
            </fieldset>
        </section>

        <br>

        <section class="controls">
            <h3>Ações Disponíveis:</h3>
            <button class="btn-acao" data-acao="monocultura">Monocultura (Lucro Rápido)</button>
            <br><br>
            <button class="btn-acao" data-acao="rotacao">Rotação de Culturas (Sustentável)</button>
            <br><br>
            <button class="btn-acao" data-acao="descanso">Descanso do Solo (Recuperação)</button>
        </section>
    </main>
</body>
</html>
